<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Manutenção">
<title>Manutenção</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{overscroll-behavior-y:none}
nav{padding-bottom:env(safe-area-inset-bottom)}
.toast{bottom:calc(86px + env(safe-area-inset-bottom))}
.login{max-width:380px;margin:40px auto;padding:0 18px}
.login .logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;margin-bottom:6px}
.login .logo .dot{width:14px;height:14px;border-radius:3px;background:var(--accent)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px}
.fotos .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#e9e5dd;cursor:pointer}
.fotos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.fotos .ph button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:12px}
.upl{display:inline-flex;align-items:center;gap:6px}
.upl input{display:none}
.big img{max-width:100%;border-radius:10px;display:block;margin:0 auto}
.cred{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font:14px/1.6 "IBM Plex Mono",monospace;white-space:pre-wrap}
:root{
  --bg:#f3f1ec; --card:#fff; --ink:#1d2125; --muted:#6b7177; --line:#e2ded6;
  --head:#1f2a30; --accent:#e8892b; --accent-ink:#fff;
  --red:#c8412f; --red-bg:#fbe9e5; --amber:#b7700c; --amber-bg:#fdf1dc;
  --green:#2f7d4f; --green-bg:#e3f2e8; --blue:#2c6aa0; --blue-bg:#e3eef8;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
header{background:var(--head);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;position:sticky;top:0;z-index:5}
header .row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:860px;margin:0 auto}
header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
header h1 .dot{width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block}
.sync{font-size:12px;color:#b8c2c8}
main{max-width:860px;margin:0 auto;padding:16px 14px calc(150px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
nav .in{display:flex;width:100%;max-width:860px}
nav button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--ink)}
nav button.on svg{color:var(--accent)}
h2{font-size:20px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:22px 0 8px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.stat b{display:block;font:600 28px/1.1 "IBM Plex Mono",monospace}
.stat span{font-size:13px;color:var(--muted)}
.stat.warn b{color:var(--red)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.item:hover{border-color:#cfc9bd}
.item .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--line);flex:none}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--muted);margin-top:2px}
.item .r{text-align:right;font-size:12.5px;color:var(--muted);flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:#eee;color:#444;white-space:nowrap}
.b-red{background:var(--red-bg);color:var(--red)} .b-amber{background:var(--amber-bg);color:var(--amber)}
.b-green{background:var(--green-bg);color:var(--green)} .b-blue{background:var(--blue-bg);color:var(--blue)}
.bar.red{background:var(--red)} .bar.amber{background:var(--accent)} .bar.green{background:var(--green)} .bar.blue{background:var(--blue)}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#bdb6a8}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--head);border-color:var(--head);color:#fff}
.btn.danger{color:var(--red)}
.btn.danger.arm{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--head);color:#fff;border-color:var(--head)}
.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;margin-bottom:10px}
.empty{background:var(--card);border:1px dashed #cfc9bd;border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:10px}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--amber-bg);color:#6b4708;margin-bottom:12px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,26,30,.45);z-index:20;display:none;align-items:flex-end;justify-content:center;padding-top:calc(env(safe-area-inset-top) + 8px)}
.scrim.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:16px 16px 0 0;padding:0 0 calc(110px + env(safe-area-inset-bottom))}
@media(min-width:700px){.scrim{align-items:center;padding:24px}.sheet{border-radius:16px;max-height:88vh;padding-bottom:24px}}
.sheet .top{position:sticky;top:0;background:var(--bg);padding:14px 18px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);z-index:1}
.sheet .top h4{margin:0;font-size:17px}
.sheet .body{padding:14px 18px}
.x{border:0;background:#e9e5dd;border-radius:50%;width:38px;height:38px;flex:none;font-size:24px;line-height:1;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
label.f input,label.f select,label.f textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
label.f textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.actions .sp{flex:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:none;padding:9px 6px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--head);color:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk .box{width:22px;height:22px;border:2px solid #b9b2a4;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;background:#fff}
.chk.ok .box{background:var(--green);border-color:var(--green);color:#fff}
.chk.ok .lbl{color:var(--muted);text-decoration:line-through}
.parts{display:flex;flex-direction:column;gap:6px}
.part{display:flex;gap:8px;align-items:center;font-size:14px}
.part .n{flex:1}
.addpart{display:flex;gap:6px;margin-top:8px}
.addpart input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;min-width:0}
.addpart input:first-child{flex:1}
.addpart input:nth-child(2){width:70px}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.progress i{display:block;height:100%;background:var(--green)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--head);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
pre.rep{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.5 "IBM Plex Mono",monospace;max-height:50vh;overflow:auto}
.bell{position:relative;border:0;background:none;font-size:18px;cursor:pointer;padding:2px 4px;line-height:1}
.bell i{position:absolute;top:-4px;right:-6px;background:var(--red);color:#fff;font:600 10.5px/1 "IBM Plex Sans",sans-serif;font-style:normal;border-radius:9px;padding:2px 5px}
a.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.btn.wa{display:inline-block;background:#25d366;border-color:#25d366;color:#fff;text-decoration:none}
.warnTxt{color:var(--red);font-weight:600}
#who .who-n{color:#dfe5e8;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#printArea{display:none}
@media print{
  @page{size:A4;margin:14mm}
  html,body{background:#fff !important}
  main,nav,header,.scrim,.toast{display:none !important}
  body > *:not(#printArea){display:none !important}
  #printArea{display:block;color:#000;font:11pt/1.4 "IBM Plex Sans",Arial,sans-serif}
}
.pr h1{font-size:16pt;margin:0}
.pr .lg{display:flex;align-items:center;gap:14px}
.pr .lg img{height:16mm;width:auto}
.pr .pb,.pb{break-before:page;page-break-before:always}
@page resumo{size:A4 landscape;margin:10mm}
.sumpage{page:resumo}
.pr table.sm{font-size:8.5pt}
.pr table.sm td,.pr table.sm th{padding:3px 5px}
.pr h3.sub{font-size:9.5pt;margin:8px 0 4px;color:#333}
.pr tr{break-inside:avoid}
.pr .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:12px}
.pr .hd .meta{text-align:right;font-size:9.5pt}
.pr h2{break-after:avoid;font-size:11pt;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px;border-bottom:1px solid #999;padding-bottom:2px}
.pr table{width:100%;border-collapse:collapse;font-size:10pt}
.pr td,.pr th{border:1px solid #bbb;padding:4px 6px;text-align:left;vertical-align:top}
.pr th{background:#eee}
.pr .prkv th{width:24%}
.pr .txt{white-space:pre-wrap;border:1px solid #bbb;padding:6px 8px;min-height:40px;font-size:10pt}
.pr .ph{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pr .ph img{width:100%;height:62mm;object-fit:cover;border:1px solid #bbb;break-inside:avoid}
.pr .sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:34px;break-inside:avoid}
.pr .sig{align-items:end}
.pr .sig > div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-height:22mm}
.pr .sig span{display:block;width:100%;border-top:1px solid #000;padding-top:4px;font-size:9.5pt;text-align:center}
.pr .sig .sgimg{max-height:18mm;max-width:70%;margin-bottom:-1mm;position:relative;z-index:1}
.pr .ft{margin-top:18px;font-size:8.5pt;color:#555;text-align:center}
</style>

</head>
<body>
<header><div class="row"><h1><span class="dot"></span>Manutenção</h1><span style="display:flex;align-items:center;gap:8px"><span class="sync" id="sync"></span><span id="who" style="display:flex;align-items:center;gap:6px;font-size:13px"></span></span></div></header>
<main id="app"><div class="empty">A carregar…</div></main>
<nav><div class="in" id="nav"></div></nav>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="config.js?v=20"></script>
<script type="module" src="app.js?v=20"></script>
</body>
</html>
