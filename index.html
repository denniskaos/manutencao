<style>
html,body{overscroll-behavior:none;max-width:100%;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media(max-width:700px){input,select,textarea{font-size:16px !important}}

.navver{font:10.5px/1 "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);opacity:.7;padding:0 0 2px;height:11px}

.toast{bottom:calc(86px + env(safe-area-inset-bottom))}

.login .logo .dot{width:14px;height:14px;border-radius:3px;background:var(--accent)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px}
.fotos .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#e9e5dd;cursor:pointer}
.fotos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.fotos .ph button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:12px}
.upl{display:inline-flex;align-items:center;gap:6px}
.upl input{display:none}
.big img{max-width:100%;border-radius:10px;display:block;margin:0 auto}
.cred{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font:14px/1.6 "IBM Plex Mono",monospace;white-space:pre-wrap}
:root{
  --bg:#f3f1ec; --card:#fff; --ink:#1d2125; --muted:#6b7177; --line:#e2ded6;
  --head:#1f2a30; --accent:#e8892b; --accent-ink:#fff;
  --red:#c8412f; --red-bg:#fbe9e5; --amber:#b7700c; --amber-bg:#fdf1dc;
  --green:#2f7d4f; --green-bg:#e3f2e8; --blue:#2c6aa0; --blue-bg:#e3eef8;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
header{background:var(--head);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;position:relative;z-index:5;flex:0 0 auto}
header .row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:var(--maxw);margin:0 auto}
header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
header h1 .dot{width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block}
header h1 .hlogo{width:26px;height:26px;flex:0 0 auto;display:block}
.sync{font-size:12px;color:#b8c2c8}
/* Montagem de app: barra de cima e menu de baixo parados; só o meio desliza. */
html,body{height:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;height:var(--apph,100dvh);overflow:hidden}
main{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-gutter:stable;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px max(14px, calc((100% - var(--maxw)) / 2)) 28px;box-sizing:border-box;width:100%}
nav{position:relative;flex:0 0 auto;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
nav .in{display:flex;width:100%;max-width:var(--maxw)}
nav button{flex:1;border:0;background:none;padding:9px 4px 5px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--ink)}
@media(max-width:440px){.who-n{display:none}}
nav button{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:380px){nav .in.many button{font-size:9.6px !important;letter-spacing:-.2px !important}}
nav .in.many button{font-size:10.5px;padding-left:1px;padding-right:1px;letter-spacing:-.1px}
nav button.on svg{color:var(--accent)}
/* Computador: menu numa barra à esquerda */
@media(min-width:1100px){
  :root{--maxw:1240px}
  html{overflow:hidden}
  body{display:grid;grid-template-columns:200px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  main{min-width:0;min-height:0}
  header{grid-column:1 / -1}
  header .row{max-width:none}
  nav{grid-column:1;grid-row:2;flex-direction:column;justify-content:space-between;align-items:stretch;border-top:0;border-right:1px solid var(--line);padding:14px 10px 10px !important;overflow-y:auto}
  nav .in{flex-direction:column;gap:2px;max-width:none}
  nav button,nav .in.many button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px !important;font-size:14.5px !important;letter-spacing:0 !important;border-radius:10px;text-align:left}
  nav button:hover{background:#f6f3ec}
  nav button.on{background:#fbefe2;color:var(--ink)}
  nav button svg{width:21px;height:21px;flex:0 0 auto}
  .navver{align-self:center;padding-top:10px}
  main{grid-column:2;grid-row:2;padding:20px max(24px, calc((100% - var(--maxw)) / 2)) 32px}
}

.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.srow:last-child{border-bottom:0}

details.svcpick{margin:-4px 0 12px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 12px}

.mpk-g{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 18px 2px 38px}
.geol{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:flex;flex-direction:column;gap:4px}.geol .btn{width:100%;justify-content:center;white-space:normal}.geol span{font-size:12.5px;color:var(--muted);text-align:center}.geol.ok{font-size:12.5px;color:var(--muted);flex-direction:row;align-items:center}
.aqui{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:0 0 10px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;background:#fbf7f1}.aqui .muted{font-size:13px;color:var(--muted);flex:1 1 200px}.aqui .schip{margin:4px 4px 0 0}
.tipoh{display:flex;align-items:center;gap:4px;color:var(--ink);font-weight:700;font-size:14.5px;margin:14px 2px 6px}.tipoh .badge{margin-left:2px}.tipoh+.list{margin-bottom:4px}
.fatn2{display:flex;gap:6px;flex-wrap:wrap}.fatn2 .fatn{flex:1 1 160px;min-width:0}
.mforn{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
.dalm{font-size:12.5px;color:var(--muted);margin:2px 0 0}.dalm a{color:var(--accent)}.dalm:empty{display:none}
.cfil{position:relative;min-width:0}.cfil .search{width:100%}
.cfil.on{display:flex;gap:6px;align-items:center}.cfil.on .search{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff8ef;border-color:var(--accent)}.cfil.on .search b{color:var(--accent)}
.cdrop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;max-height:340px;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.cres{border:1px solid var(--line);border-radius:12px;background:#fff;margin:0 0 6px;overflow:hidden}
.cres button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 12px;font:inherit;cursor:pointer;color:var(--ink)}
.cres button:last-child{border-bottom:0}.cres button:hover{background:#faf7f1}
.cres button b{color:var(--accent);margin-right:4px}.cres small{display:block;color:var(--muted);font-size:12.5px}
.cres .mais{padding:8px 12px;font-size:13px;color:var(--muted)}
.note.wxnote{display:flex;gap:10px;align-items:flex-start;cursor:pointer;background:#e8f0fa;border-color:#c9daf0;color:#1d3b5c}

:root{--maxw:860px}
@media(min-width:1400px){:root{--maxw:1180px}}
.frow{display:grid;grid-template-columns:1fr;gap:0 10px}
@media(min-width:700px){.frow{grid-template-columns:1fr 1fr}}
.duo{display:grid;grid-template-columns:1fr;gap:0 16px;align-items:start}
@media(min-width:1000px){.duo{grid-template-columns:1fr 1fr}}
.duo > div{min-width:0}
.eurin{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px 0 0;flex:0 0 auto}
.eurin input{width:72px;border:0;background:transparent;text-align:right;padding:8px 4px 8px 8px;font:inherit;font-variant-numeric:tabular-nums;outline:none}
.eurin span{color:var(--muted);font-size:14px}
.eurin:focus-within{border-color:var(--accent)}
.panel.tarifas{padding-top:4px;padding-bottom:10px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.trow span small{display:block;color:var(--muted);font-size:12px}
.panel .hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.mrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.mrow .mn{flex:1;min-width:0}
